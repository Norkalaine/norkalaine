<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Norkalaine</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000000;
    overflow: hidden;
  }
  .screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000000;
  }
  #screen2 {
    background: #ffffff;
    opacity: 0;
    pointer-events: none;
  }
  #screen2.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .center {
    text-align: center;
  }
  button#norkalaine-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    margin: 0;
  }
  h1 {
    color: #ffffff;
    font-family: Impact, "Arial Narrow Bold", "Haettenschweiler", sans-serif;
    font-size: clamp(3rem, 12vw, 10rem);
    letter-spacing: 0.02em;
    text-align: center;
    margin: 0;
    padding: 0 1rem;
    transform-origin: center center;
  }
  h1.zoom {
    animation: zoom-fill 1.1s cubic-bezier(0.55, 0, 1, 0.45) forwards;
  }
  @keyframes zoom-fill {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(55);
    }
  }
  p.hint {
    color: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 0.9rem;
    margin: 0.5rem 0 0;
    opacity: 0.7;
    transition: opacity 0.3s ease;
  }
  p.hint.fade {
    opacity: 0;
  }

  h2.screen2-text {
    color: #000000;
    font-family: Impact, "Arial Narrow Bold", "Haettenschweiler", sans-serif;
    font-size: clamp(2rem, 8vw, 6rem);
    letter-spacing: 0.02em;
    text-align: center;
    margin: 0;
    opacity: 0;
    transition: opacity 0.7s ease-in;
  }
  h2.screen2-text.fade-in {
    opacity: 1;
  }
</style>
</head>
<body>

  <div class="screen" id="screen1">
    <div class="center">
      <button id="norkalaine-btn" aria-label="Norkalaine">
        <h1 id="norkalaine-text">Norkalaine</h1>
      </button>
      <p class="hint" id="hintText">Click it</p>
    </div>
  </div>

  <div class="screen" id="screen2">
    <h2 class="screen2-text" id="screen2Text">Work in progress</h2>
  </div>

  <script>
    const btn = document.getElementById('norkalaine-btn');
    const text = document.getElementById('norkalaine-text');
    const hint = document.getElementById('hintText');
    const screen2 = document.getElementById('screen2');
    const screen2Text = document.getElementById('screen2Text');

    btn.addEventListener('click', () => {
      text.classList.add('zoom');
      hint.classList.add('fade');

      text.addEventListener('animationend', () => {
        screen2.classList.add('visible');
        setTimeout(() => {
          screen2Text.classList.add('fade-in');
        }, 100);
      }, { once: true });
    });
  </script>
</body>
</html>
