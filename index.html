<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Norkalaine</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <video id="bg-video" class="bg-video" autoplay muted loop playsinline>
    <source src="assets/background.webm" type="video/webm">
  </video>

  <audio id="bg-music" loop preload="auto">
    <source src="assets/background_music.mp3" type="audio/mpeg">
  </audio>

  <div id="entry-screen">
    <button id="enter-btn">Enter</button>
  </div>

  <div id="audio-controls">
    <button id="sound-toggle" aria-label="Toggle sound" aria-pressed="false">
      <img id="sound-icon" src="assets/muted.png" alt="">
    </button>
    <input type="range" id="volume-slider" min="0" max="100" value="50" aria-label="Volume">
  </div>

  <script src="script.js"></script>
</body>
</html>
