<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Norkalaine</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button#norkalaine-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    margin: 0;
  }
  .text-wrap {
    position: relative;
    display: inline-block;
  }
  h1 {
    color: #ffffff;
    font-family: Impact, "Arial Narrow Bold", "Haettenschweiler", sans-serif;
    font-size: clamp(3rem, 12vw, 10rem);
    letter-spacing: 0.02em;
    text-align: center;
    margin: 0;
    padding: 0 1rem;
    user-select: none;
    position: relative;
    z-index: 2;
    transition: color 1.1s ease-in-out;
  }
  h1.red {
    color: #b0060f;
  }

  .drips {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .drip {
    position: absolute;
    bottom: 18%;
    width: 0.9vw;
    max-width: 14px;
    min-width: 6px;
    border-radius: 0 0 50% 50% / 0 0 60% 60%;
    background: linear-gradient(180deg, #b0060f 0%, #7a040b 100%);
    box-shadow: 0 0 6px rgba(176, 6, 15, 0.6);
    height: 0;
    opacity: 0;
    transform-origin: top center;
  }
  .drip::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -6px;
    width: 140%;
    height: 12px;
    background: #b0060f;
    border-radius: 50%;
    transform: translateX(-50%) scaleY(0);
    transform-origin: center top;
    opacity: 0;
    box-shadow: 0 0 6px rgba(176, 6, 15, 0.6);
    transition: transform 0.4s ease-out, opacity 0.4s ease-out;
  }

  .red .drip {
    opacity: 1;
    animation: drip-grow 1.4s cubic-bezier(0.33, 1, 0.68, 1) forwards;
  }
  .red .drip::after {
    transform: translateX(-50%) scaleY(1);
    opacity: 1;
    transition-delay: 1s;
  }

  @keyframes drip-grow {
    0% {
      height: 0;
      opacity: 0;
    }
    15% {
      opacity: 1;
    }
    100% {
      opacity: 1;
    }
  }
</style>
</head>
<body>
  <button id="norkalaine-btn" aria-label="Norkalaine">
    <div class="text-wrap">
      <h1 id="norkalaine-text">Norkalaine</h1>
      <div class="drips" id="drips-layer"></div>
    </div>
  </button>

  <script>
    const btn = document.getElementById('norkalaine-btn');
    const text = document.getElementById('norkalaine-text');
    const dripsLayer = document.getElementById('drips-layer');

    const dripConfigs = [
      { left: 8,  height: 55, delay: 0.0 },
      { left: 18, height: 90, delay: 0.15 },
      { left: 27, height: 40, delay: 0.05 },
      { left: 38, height: 70, delay: 0.25 },
      { left: 47, height: 100, delay: 0.1 },
      { left: 56, height: 50, delay: 0.3 },
      { left: 65, height: 80, delay: 0.05 },
      { left: 74, height: 60, delay: 0.2 },
      { left: 83, height: 95, delay: 0.15 },
      { left: 92, height: 45, delay: 0.25 }
    ];

    function buildDrips() {
      dripsLayer.innerHTML = '';
      dripConfigs.forEach(cfg => {
        const d = document.createElement('div');
        d.className = 'drip';
        d.style.left = cfg.left + '%';
        d.style.animationDelay = cfg.delay + 's';
        d.style.transitionDelay = cfg.delay + 's';
        d.addEventListener('animationend', () => {
          d.style.height = cfg.height + 'px';
        });
        dripsLayer.appendChild(d);
      });
    }

    btn.addEventListener('click', () => {
      const turningRed = !text.classList.contains('red');
      if (turningRed) {
        buildDrips();
      } else {
        dripsLayer.innerHTML = '';
      }
      text.classList.toggle('red');
    });
  </script>
</body>
</html>
